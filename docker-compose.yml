# Docker Compose para entorno local (Laravel 12)
# Uso: docker compose up -d && docker compose exec app bash (para ejecutar migrate, seed, queue, etc.)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: appbuscame-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - appbuscame
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: appbuscame-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - appbuscame
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: appbuscame-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: appbuscame
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: appbuscame
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - appbuscame

  redis:
    image: redis:alpine
    container_name: appbuscame-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - appbuscame

  mailhog:
    image: mailhog/mailhog:latest
    container_name: appbuscame-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - appbuscame

networks:
  appbuscame:
    driver: bridge

volumes:
  mysql_data:
